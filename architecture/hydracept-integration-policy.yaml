version: "1"
consumer_rule:
  - External products are customers of the public Hydracept surface, not privileged bypasses.
  - If an external customer cannot do it through the supported Hydracept surface, no product should bypass the public surface that way either.
  - Temporary exceptions require an entry in architecture/hydracept-consumer-exceptions.yaml with expiry.
  - Run hydracept consumer-check --strict in product CI before merge.
security:
  - Never embed Hydracept API tokens or provider keys in shipped game clients.
  - Never commit credentials; use environment variables or CI secret stores.
  - Prefer a server-side proxy for player-facing applications.
async_jobs:
  - Submit via POST /v1/capabilities/{key}/jobs with idempotencyKey.
  - Poll GET /v1/jobs/{jobId} until status is succeeded, failed, or canceled.
  - Fetch receipt via GET /v1/jobs/{jobId}/receipt.
history:
  list: GET /v1/projects/{projectId}/jobs
  inspect: GET /v1/jobs/{jobId}
  receipt: GET /v1/jobs/{jobId}/receipt
  request: requestSnapshot on GET /v1/jobs/{jobId}
  filters:
    - status
    - capabilityKey
    - outcome=failed
    - outcome=reusable
    - selected=true
  mcp:
    - hydracept_jobs_find
    - hydracept_job_inspect
  rules:
    - Project history is prompt-free; list items never include prompts, request snapshots, or error messages.
    - If a user reports a prior failure or asks to reuse prior output, find history before asking for a job id.
    - Inspect only the specific job whose request/error content is needed.
    - Re-run with a new idempotencyKey. On QUOTE_MISMATCH omit stale execution.quoteId or estimateId.
    - Reusable means succeeded with an output artifact. Prefer an explicit selectedArtifactId when present.
    - Reuse is not favorite, review, approval, or promotion.
    - Pinned research execution remains separate and by-id.
verification:
  - Run hydracept doctor after integration changes.
  - Use GET /v1/diagnostics/session to verify auth and bundle version.
discovery:
  - Browse capabilities: GET /v1/capabilities?view=summary
  - List capabilities: GET /v1/capabilities
  - Describe capability: GET /v1/capabilities/{key}
  - Treat inputConstraints on the descriptor as the overflow contract. Hydracept never silently truncates semantic user input.
  - Resolve missing capability: POST /v1/capabilities/resolve (side-effect free; never spends)
  - Retail quote: POST /v1/capabilities/{key}/quote (optional preview; never reserves or charges). /estimate is the HTTP alias of the same 0.3 response.
  - Anonymous catalog prices: pricingContext catalog_default, authoritativeForExecution false
  - Authenticated quotes: account billing currency, authoritativeForExecution true
  - Agent context bundle: GET /v1/agent-context
  - Capability request: POST /v1/capability-requests (non-binding; humans pay quotes)
input_overflow:
  - Reject semantic prompt overflow before quote, reservation, or provider submission (HTTP 422 PromptTooLong).
  - Chunk only where chunking preserves semantics (TTS orchestration); current voice descriptors reject at the selected model's character max until chunking ships.
  - Prune only fields marked disposable context. Do not prune instructions, user prompts, or structured inputs.
  - Limits may be model-specific (inputConstraints.<field>.byModel). JSON Schema maxLength is the coarse ceiling.
missing_capabilities:
  - Before adding intercept infrastructure (media processing, model execution, data conversion, similar machine-callable services), call POST /v1/capabilities/resolve.
  - If resolution is no_match_requestable, you may create a non-binding capability request. Requesting a quote does not spend money.
  - Never accept or pay a commission quote from an agent. Only a human may approve payment.
  - Never treat catalog USD list prices as the customer's execution price.
  - Read pricingFactors. Missing inputs on /quote return quote_requires_input. Submit jobs without execution.quoteId; the API seals pricing at admission.
  - Do not expect /quote to hold wallet funds. Omit execution.quoteId on submit; the API seals a quote at admission. Reusing a stale quoteId returns QUOTE_MISMATCH.
byok:
  - Store org credentials: POST /v1/organizations/{orgId}/provider-credentials
  - Bind to project/env: POST /v1/organizations/{orgId}/provider-credentials/{credentialId}/bindings
  - Project-level legacy vault: POST /v1/projects/{projectId}/provider-credentials
