[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydracept"
version = "0.5.2"
description = "Python client and CLI for the Hydracept public API — execution control plane for software and agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zencode" }]
keywords = [
  "hydracept",
  "ai-agent-infrastructure",
  "agent-execution",
  "ai-execution",
  "mcp",
  "agent-tools",
  "ai-capabilities",
  "multi-provider",
  "durable-jobs",
  "byok",
  "receipts",
  "image-generation",
  "video-generation",
  "audio-generation",
  "3d-generation",
  "game-assets",
  "unity",
  "sprite-sheet",
  "transparent-png",
  "reference-image",
  "gamedev",
  "game-ai",
  "model-context-protocol",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.15.0,<0.26",
  "rich>=13.9.0",
  "PyYAML>=6.0",
  "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://hydracept.com"
Documentation = "https://docs.hydracept.com"
Repository = "https://github.com/zencodeinc/hydracept-public"
"Source Code" = "https://github.com/zencodeinc/hydracept-public"
"Bug Tracker" = "https://github.com/zencodeinc/hydracept-public/issues"
"Agent Context" = "https://api.hydracept.com/v1/agent-context"
"MCP Server" = "https://api.hydracept.com/mcp"
"MCP Registry" = "https://github.com/zencodeinc/hydracept-plugin/blob/main/mcp-registry/server.json"
"Cursor Plugin" = "https://github.com/zencodeinc/hydracept-plugin"

[project.scripts]
hydracept = "hydracept.cli.entrypoint:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydracept*"]

[tool.setuptools.package-data]
hydracept = ["data/*.yaml", "data/agents/**/*", "cli/schemas/*.json", "mcp/ui/app.html"]
