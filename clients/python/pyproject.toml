[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydracept"
version = "0.4.3"
description = "Python client and CLI for the Hydracept public API — execution control plane for software and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zencode Consulting Inc." }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
  "hydracept",
  "mcp",
  "gamedev",
  "unity",
  "image-generation",
  "sprite-sheet",
  "transparent-png",
  "reference-image",
  "multi-provider",
  "game-ai",
]
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.15.0,<0.26",
  "rich>=13.9.0",
  "PyYAML>=6.0",
  "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://hydracept.com"
Documentation = "https://docs.hydracept.com"
Repository = "https://github.com/zencodeinc/hydracept-public"
Issues = "https://github.com/zencodeinc/hydracept-public/issues"
Changelog = "https://github.com/zencodeinc/hydracept-public/blob/main/clients/python/CHANGELOG.md"

[project.scripts]
hydracept = "hydracept.cli.entrypoint:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydracept*"]

[tool.setuptools.package-data]
hydracept = ["data/*.yaml", "data/agents/**/*", "cli/schemas/*.json", "mcp/ui/app.html"]
