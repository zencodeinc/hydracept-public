[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydracept"
version = "0.4.3"
description = "Python client and CLI for the Hydracept public API — execution control plane for software and agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zencode" }]
keywords = [
  "hydracept",
  "mcp",
  "gamedev",
  "unity",
  "image-generation",
  "sprite-sheet",
  "transparent-png",
  "reference-image",
  "multi-provider",
  "game-ai",
]
dependencies = [
  "httpx>=0.27.0",
  "typer>=0.15.0,<0.26",
  "rich>=13.9.0",
  "PyYAML>=6.0",
  "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://hydracept.com"
Documentation = "https://hydracept.com/docs"
Repository = "https://github.com/zencodeinc/hydracept-public"

[project.scripts]
hydracept = "hydracept.cli.entrypoint:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hydracept*"]

[tool.setuptools.package-data]
hydracept = ["data/*.yaml", "data/agents/**/*", "cli/schemas/*.json", "mcp/ui/app.html"]
