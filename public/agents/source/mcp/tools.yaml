server:
  name: hydracept
  instructions: >-
    Hydracept public capability jobs. In a git checkout, use stdio MCP after
    `python -m hydracept init` (workspace secrets). Hosted MCP with an API key
    is for clients with no checkout. One capability call is enough — do not
    assume repeated usage is required. hydracept_run composes workspace
    bootstrap when possible. Credentials never enter model context.
tools:
  - name: hydracept_status
    summary: Local workspace readiness (stdio) or session diagnostics (hosted).
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_capabilities
    summary: List, find (query), or describe a capability, including one-shot readiness facts. Look for features.deferredProcessing on text job_async capabilities.
    readOnlyHint: true
    destructiveHint: false
  - name: resolve_capability
    summary: Determine whether Hydracept already provides a suitable capability. Does not spend money.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_quote_capability
    summary: Firm retail quote in account currency. Does not reserve or charge funds.
    readOnlyHint: true
    destructiveHint: false
  - name: estimate_capability
    summary: HTTP alias of hydracept_quote_capability. Same 0.3 retail quote.
    readOnlyHint: true
    destructiveHint: false
  - name: request_capability_quote
    summary: Create a non-binding capability REQUEST. Humans pay commission quotes; never use as execution.quoteId.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_invoke
    summary: Invoke a synchronous capability such as domain search, DNS list, or TLS retrieve.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_run
    summary: Run a capability from a prompt. Composes init when the workspace can be bootstrapped.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_submit_job
    summary: Submit a capability job. Eligible durable text jobs use deferred processing at 50% of standard token rates.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_job_status
    summary: GET /v1/jobs/{jobId} once. If nextAction is poll, wait pollAfterSeconds and call again.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_get_receipt
    summary: Fetch sealed receipt summary for a job.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_download_artifact
    summary: Download a job artifact (stdio writes locally; hosted returns signed metadata).
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_smoke
    summary: Explicit managed-trial smoke. Never run automatically on session start.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_pinned_run
    summary: Submit pinned execution. Standard by default. Opt in with processing=deferred on eligible OpenAI Responses pins (50% Flex); one logical model execution, admission retries recorded, no truncation rewrite.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_pinned_bulk
    summary: Submit a durable pinned bulk of independent items (one logical execution each; admission retries recorded).
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_pinned_bulk_get
    summary: GET a pinned bulk once. If nextAction is poll, wait pollAfterSeconds and call again.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_pinned_get
    summary: GET a pinned execution receipt by id.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_manifest_create
    summary: Create a provenance manifest.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_manifest_verify
    summary: Verify a provenance manifest by id.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_lockfile_emit
    summary: Emit an AI lockfile from a receipt id.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_verify_lockfile
    summary: Verify an AI lockfile document.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_project_status
    summary: Stdio only. Bound project surface status in the game checkout.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_project_up_install
    summary: Stdio only. Apply surfaces and install the local watcher.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_surface_apply
    summary: Stdio only. Apply a surface definition JSON onto the bound project.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_project_sync
    summary: Stdio only. Sync the project allowlist from the local manifest.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_project_watch_once
    summary: Stdio only. Run one watcher pass.
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_project_request_operation
    summary: Request a named project operation (stdio local; hosted HTTP).
    readOnlyHint: false
    destructiveHint: false
  - name: hydracept_project_get_operation
    summary: GET a project operation by id.
    readOnlyHint: true
    destructiveHint: false
  - name: hydracept_interaction_surface
    summary: Present one Hydracept App state. Follow presentation.agentAction; present_and_yield means stop the turn.
    readOnlyHint: true
    destructiveHint: false
