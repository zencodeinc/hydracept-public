# Capability keys exposed through MCP and marketplace copy.
capabilities:
  - key: image.generate.v1
    summary: Generate transparent PNGs, sprite sheets, icon variants, and production game assets.
  - key: image.edit.v1
    summary: In-place edit of a source PNG via images.edit (source, optional mask, insert graphics).
  - key: text.general.fast.v1
    summary: Fast text generation. Sync invoke is held for the provider read timeout (600s) and has no separate token ceiling. Durable jobs share hydracept-durable-text; eligible jobs may wait 900s deferred. The activity deadline is the shared 2h ceiling, above that wait. Queue wait is 2h.
  - key: text.reasoning.high.v1
    summary: High-reasoning text generation.
  - key: text.reasoning.maximum.v1
    summary: Maximum-reasoning long-context text generation, including multi-document jobs.
  - key: text.vision.structured.v1
    summary: Read attached image pixels and return structured JSON.
  - key: audio.sfx.generate.v1
    summary: Sound effect generation.
  - key: audio.voice.generate.v1
    summary: Voice generation.
  - key: model.generate.3d.v1
    summary: 3D model generation.
